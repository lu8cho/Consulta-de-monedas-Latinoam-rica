<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P vs Oficial - La Verdad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ESTA ES LA PIEDRA ANGULAR. Las tasas oficiales hardcodeadas que no las mueve ni Dios.
        // Valores actualizados a marzo de 2026.
        const OFFICIAL_RATES = {
            ARS: 1398.26,
            BOB: 6.91,
            CLP: 917.43,
            PEN: 3.45
        };

        const COUNTRIES = [
            { id: 'ARS', name: 'Argentina', flag: '🇦🇷', currency: 'ARS', endpoint: 'https://api.criptoya.com/api/binancep2p/USDT/ARS/500' },
            { id: 'BOB', name: 'Bolivia', flag: '🇧🇴', currency: 'BOB', endpoint: 'https://api.criptoya.com/api/binancep2p/USDT/BOB/500' },
            { id: 'CLP', name: 'Chile', flag: '🇨🇱', currency: 'CLP', endpoint: 'https://api.criptoya.com/api/binancep2p/USDT/CLP/500' },
            { id: 'PEN', name: 'Perú', flag: '🇵🇪', currency: 'PEN', endpoint: 'https://api.criptoya.com/api/binancep2p/USDT/PEN/500' }
        ];

        const App = () => {
            const [prices, setPrices] = React.useState({});
            const [loading, setLoading] = React.useState(true);

            const fetchPrices = async () => {
                const newPrices = { ...prices };
                for (const country of COUNTRIES) {
                    try {
                        const res = await fetch(country.endpoint);
                        const data = await res.json();
                        // Asumimos que la API devuelve el precio en .ask (el precio de venta). 
                        // Si la pinche API devuelve un objeto directo o el precio está en otro lado, se ajusta aquí.
                        const currentPrice = data.ask || data.price || (data.data && data.data.price) || 0;
                        newPrices[country.id] = parseFloat(currentPrice);
                    } catch (error) {
                        console.error(`¡Error de mierda jalando data de ${country.name}!`, error);
                        newPrices[country.id] = null; // Para mostrar que se cayó esta mierda
                    }
                }
                setPrices(newPrices);
                setLoading(false);
            };

            React.useEffect(() => {
                fetchPrices(); // Primer putazo al cargar
                const interval = setInterval(fetchPrices, 30000); // Se refresca cada jodidos 30 segundos
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="min-h-screen p-6 md:p-12">
                    <header className="mb-12 text-center">
                        <h1 className="text-4xl md:text-6xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 tracking-tight">
                            BINANCE P2P vs OFICIAL
                        </h1>
                        <p className="text-slate-400 font-semibold uppercase tracking-widest text-sm md:text-base">
                            La cruda y maldita realidad del mercado
                        </p>
                    </header>

                    {loading ? (
                        <div className="text-center text-2xl font-bold text-slate-400 animate-pulse mt-20">
                            Cargando esta mierda, aguanta un segundo...
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-7xl mx-auto">
                            {COUNTRIES.map(c => {
                                const p2p = prices[c.id];
                                const official = OFFICIAL_RATES[c.id];
                                let diff = 0;
                                let isPositive = true;

                                if (p2p) {
                                    // La puta fórmula matemática sin rodeos
                                    diff = ((p2p - official) / official) * 100;
                                    isPositive = diff >= 0;
                                }

                                return (
                                    <div key={c.id} className="bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 hover:border-slate-500 transition-all duration-300">
                                        <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                                            <h2 className="text-2xl font-black flex items-center gap-3">
                                                <span className="text-3xl">{c.flag}</span> 
                                                {c.name}
                                            </h2>
                                            <span className="bg-slate-900 px-3 py-1 rounded-md text-sm font-bold text-slate-300 border border-slate-600">
                                                {c.currency}
                                            </span>
                                        </div>
                                        
                                        {p2p ? (
                                            <div className="space-y-5">
                                                <div>
                                                    <p className="text-slate-400 text-xs uppercase font-bold tracking-wider mb-1">Precio Binance P2P</p>
                                                    <p className="text-4xl font-black text-white">{p2p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                                                </div>
                                                <div>
                                                    <p className="text-slate-500 text-xs uppercase font-bold tracking-wider mb-1">Tasa Oficial (Gobierno)</p>
                                                    <p className="text-2xl font-semibold text-slate-300">{official.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                                                </div>
                                                <div className="pt-5 mt-2 border-t border-slate-700">
                                                    <p className="text-slate-400 text-xs uppercase font-bold tracking-wider mb-2">Brecha / Diferencia</p>
                                                    <p className={`text-4xl font-black ${isPositive ? 'text-green-400' : 'text-red-500'}`}>
                                                        {isPositive ? '+' : ''}{diff.toFixed(2)}%
                                                    </p>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-red-400 py-10 text-center font-bold text-xl">
                                                ¡La puta API no responde!
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
